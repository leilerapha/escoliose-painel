<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pagamentos pendentes</title>
<style>
  :root{--bg:#0b1220;--card:#131c2e;--card2:#0f1728;--line:#22304a;--tx:#e6edf7;--mut:#8ea0bd;--red:#f87171;--amber:#fbbf24;--accent:#5b8def}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:max(16px,env(safe-area-inset-top)) 16px 40px;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  h1{font-size:19px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--mut);font-size:12.5px;margin:2px 0 16px}
  .hero{background:linear-gradient(135deg,#16233c,#101a2e);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
  .hero .lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .hero .big{font-size:38px;font-weight:700;letter-spacing:-.03em;margin:6px 0 2px}
  .hero .meta{color:var(--mut);font-size:13px}
  .unidade{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;overflow:hidden}
  .uh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .uh .n{font-weight:650;font-size:15px}
  .uh .v{font-weight:700;font-size:15px}
  .uh .c{color:var(--mut);font-size:12px;font-weight:500}
  .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
  .row .nm{font-weight:600;font-size:14.5px;word-break:break-word}
  .row .vl{font-weight:700;font-size:14.5px;text-align:right;white-space:nowrap}
  .row .dt{color:var(--mut);font-size:12.5px}
  .row .tg{justify-self:end;font-size:11.5px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .atraso{background:rgba(248,113,113,.14);color:var(--red)}
  .recente{background:rgba(251,191,36,.14);color:var(--amber)}
  button{font:inherit;cursor:pointer;border:0}
  .btn{background:var(--accent);color:#fff;font-weight:650;padding:12px 16px;border-radius:12px;width:100%;font-size:15px}
  .btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
  .refresh{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
  .spin{width:15px;height:15px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;display:inline-block}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{display:grid;place-items:center;gap:14px;padding:48px 0;color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:16px}
  .err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#fecaca;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
  .empty{color:var(--mut);font-size:13.5px;padding:6px 0 2px}
  .foot{color:var(--mut);font-size:11.5px;text-align:center;margin-top:20px;line-height:1.5}
</style></head>
<body><div class="wrap" id="app"><div class="center"><span class="spin"></span><span>A carregar…</span></div></div>
<script>
// Painel privado. Nao contem segredos: o codigo de acesso e as credenciais do
// seufisio sao digitados pelo utilizador e guardados no seu proprio Supabase.
const FUNC="https://vxnfczgxtlckvqaldwne.supabase.co/functions/v1/painel-clinica";
const app=document.getElementById("app");
const getCode=()=>{try{return localStorage.getItem("painel_code")||""}catch(e){return""}};
const setCode=c=>{try{localStorage.setItem("painel_code",c)}catch(e){}};
const eur=n=>new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(n||0);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmtd(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return s||"";const p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0];}

function pedirCodigo(msg){
  app.innerHTML='<header><h1>Painel da clínica</h1></header>'
    +'<div class="sub">Introduza o código de acesso (uma vez por dispositivo).</div>'
    +(msg?'<div class="err">'+esc(msg)+'</div>':'')
    +'<div class="card"><label>Código de acesso</label><input id="cod" type="password" autocomplete="off">'
    +'<button class="btn" style="margin-top:16px" id="ok">Entrar</button></div>';
  document.getElementById("ok").onclick=()=>{const c=document.getElementById("cod").value.trim();if(c){setCode(c);carregar();}};
}

async function carregar(){
  const code=getCode();
  if(!code) return pedirCodigo();
  app.innerHTML='<div class="center"><span class="spin"></span><span>A consultar o seufisio…</span></div>';
  let r,d;
  try{ r=await fetch(FUNC+"?acao=dados&k="+encodeURIComponent(code)); d=await r.json(); }
  catch(e){ return erro("Falha de rede. Toque em Atualizar."); }
  if(r.status===401) return pedirCodigo("Código incorreto.");
  if(d.configurado===false) return setup();
  if(d.erro) return erro(d.erro);
  render(d);
}

function tag(dias){ if(dias==="")return""; if(dias>0)return '<span class="tg atraso">'+dias+'d em atraso</span>'; return '<span class="tg recente">vence hoje</span>'; }

function render(d){
  let h='<header><div><h1>Pagamentos pendentes</h1></div><button class="refresh" onclick="carregar()">Atualizar</button></header>'
    +'<div class="sub">Contas em aberto e vencidas até '+esc(fmtd(d.vencimento_ate))+'</div>'
    +'<div class="hero"><div class="lbl">Total a receber</div><div class="big">'+eur(d.total_valor)+'</div><div class="meta">'+d.total_contas+' contas · atualizado '+esc(d.gerado_em)+'</div></div>';
  for(const u of d.unidades){
    h+='<div class="unidade"><div class="uh"><span class="n">'+esc(u.nome)+' <span class="c">· '+u.contas+' contas</span></span><span class="v">'+eur(u.total)+'</span></div>';
    if(!u.linhas.length){ h+='<div class="empty">Sem contas pendentes.</div>'; }
    for(const l of u.linhas){
      h+='<div class="row"><div class="nm">'+esc(l.cliente)+'</div><div class="vl">'+eur(l.valor)+'</div><div class="dt">'+esc(fmtd(l.data_vencimento))+(l.servico?' · '+esc(l.servico):'')+'</div>'+tag(l.dias_atraso)+'</div>';
    }
    h+='</div>';
  }
  h+='<div class="foot">Dados ao vivo do seufisio · painel privado</div>';
  app.innerHTML=h;
}

function erro(msg){
  app.innerHTML='<header><h1>Pagamentos pendentes</h1></header><div class="err">'+esc(msg)+'</div>'
    +'<button class="btn" onclick="carregar()">Tentar de novo</button>'
    +'<button class="btn sec" style="margin-top:10px" onclick="setup()">Alterar credenciais do seufisio</button>';
}

function setup(){
  app.innerHTML='<header><h1>Configurar painel</h1></header><div class="sub">Só uma vez. Fica guardado no seu Supabase (acesso restrito ao servidor).</div>'
    +'<div class="card"><label>E-mail do seufisio</label><input id="email" type="email" autocomplete="username" inputmode="email">'
    +'<label>Senha do seufisio</label><input id="senha" type="password" autocomplete="current-password"><div id="cfgerr"></div>'
    +'<button class="btn" style="margin-top:18px" id="salvar">Guardar e entrar</button></div>';
  document.getElementById("salvar").onclick=salvar;
}

async function salvar(){
  const email=document.getElementById("email").value.trim();
  const senha=document.getElementById("senha").value;
  const b=document.getElementById("salvar"), box=document.getElementById("cfgerr");
  if(!email||!senha){ box.innerHTML='<div class="err" style="margin-top:12px">Preencha e-mail e senha.</div>'; return; }
  b.textContent="A guardar…"; b.disabled=true;
  try{
    const r=await (await fetch(FUNC+"?acao=config&k="+encodeURIComponent(getCode()),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,senha})})).json();
    if(!r.ok){ box.innerHTML='<div class="err" style="margin-top:12px">'+esc(r.erro||"Erro ao guardar")+'</div>'; b.textContent="Guardar e entrar"; b.disabled=false; return; }
    carregar();
  }catch(e){ box.innerHTML='<div class="err" style="margin-top:12px">Falha de rede.</div>'; b.textContent="Guardar e entrar"; b.disabled=false; }
}

carregar();
</script></body></html>
